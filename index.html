<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#bde7ad"><title>EcoHero Town • Küçük hareketler, büyük değişimler</title><style>
:root{--ink:#20352b;--paper:#fff9e8;--green:#3f8255;--yellow:#ffd85f}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#bde7ad;color:var(--ink);font-family:Trebuchet MS,Arial,sans-serif}button{font:inherit;font-weight:800;color:var(--ink);cursor:pointer;border:3px solid var(--ink);border-radius:16px;background:var(--paper);padding:12px 20px;box-shadow:0 4px 0 var(--ink)}button:hover{background:#ffe899;transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:none}button:focus-visible{outline:4px solid #f28552;outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;inset:20px 22px auto;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 #20352b25;padding:13px 18px}.leftHud{display:flex;gap:10px;align-items:center}.leftHud button,#hud button{pointer-events:auto}.points{font-weight:900;font-size:23px}.small{font-size:12px;letter-spacing:1px;font-weight:bold;opacity:.7}.meter{width:170px;height:12px;border:2px solid var(--ink);border-radius:10px;background:#ddd9ba;margin-top:7px;overflow:hidden}.meter span{display:block;height:100%;background:#74bb63;transition:width .5s}.task{max-width:300px;font-size:14px;line-height:1.45}#bottom{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}#hint{background:var(--paper);border:2px solid var(--ink);border-radius:15px;padding:10px 16px;font-size:13px;white-space:nowrap}#interact{background:var(--yellow);min-width:140px}#toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);max-width:90vw;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px 22px;font-weight:800;box-shadow:0 5px 0 #20352b30;opacity:0;transition:opacity .2s;pointer-events:none;z-index:8}#modal{position:fixed;inset:0;background:#20352b66;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;backdrop-filter:blur(4px)}#modal.hidden,.hidden{display:none!important}.panel{width:min(850px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:28px;padding:30px;box-shadow:0 10px 0 #20352b55}.panel h2{font-size:30px;margin:0 0 8px}.panel p{line-height:1.55}.panel header{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-top:22px}.tile{border:2px solid var(--ink);border-radius:18px;padding:18px;background:#e8eedb}.tile strong{display:block;margin:8px 0}.tile button{width:100%;padding:8px;margin-top:10px}.tag{display:inline-block;padding:5px 10px;background:#ffda73;border-radius:10px;font-size:12px;font-weight:bold}.menuPanel{width:420px;text-align:center;background:#fff9e8f2;margin-left:-40vw}.logo{font-size:57px;line-height:.9;letter-spacing:-3px;text-shadow:3px 3px #20352b;color:#ffd65d;-webkit-text-stroke:2px var(--ink);margin:14px 0}.logo span{color:#85c57c;font-size:48px}.menuPanel .buttons{display:grid;gap:12px;margin-top:25px}.primary{background:var(--yellow)}.menuPanel p{font-size:14px}.eyebrow{font-weight:900;letter-spacing:2px;font-size:11px}#mobile{position:fixed;bottom:24px;left:18px;display:none;grid-template-columns:repeat(3,45px);gap:5px;touch-action:none}#mobile button{padding:9px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}.miniTarget{font-size:55px;text-align:center;margin:20px;padding:20px;background:#d9eecf;border:3px dashed var(--ink);border-radius:20px;cursor:grab}.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bins button{padding:18px 6px}#miniStatus{min-height:26px;font-weight:800}.pipeGrid{display:grid;grid-template-columns:repeat(4,55px);gap:7px;justify-content:center;margin:20px}.pipeGrid button{height:55px;padding:0;font-size:29px}.progress{height:14px;background:#dadcc5;border:2px solid var(--ink);border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#7fb865}label{display:flex;gap:15px;align-items:center;padding:18px 0;font-weight:bold}input{accent-color:#438259}#mapnote{position:fixed;left:23px;bottom:85px;font-size:13px;font-weight:900;padding:8px 13px;background:#fff9e8dd;border:2px solid var(--ink);border-radius:10px;pointer-events:none}@media(max-width:700px){#hud{inset:10px;gap:6px}.card{padding:8px 10px;border-radius:14px}.points{font-size:17px}.small{font-size:10px}.meter{width:100px}.task{display:none}.leftHud{gap:5px}#hud button{padding:10px}.menuPanel{margin:0;width:350px}.logo{font-size:49px}.panel{padding:20px}#mobile{display:grid}#hint{display:none}#bottom{left:auto;right:14px;transform:none;bottom:35px}#interact{min-width:115px;padding:15px 10px}#mapnote{bottom:165px;left:12px}.bins{grid-template-columns:repeat(2,1fr)}}
</style></head><body><canvas id="game" aria-label="EcoHero Town oyun alanı"></canvas><div id="hud" class="hidden"><div class="leftHud"><button id="menuBtn" aria-label="Menü">☰</button><div class="card"><div class="small">ECO POINTS</div><div class="points" id="ep">0 EP</div></div><div class="card"><div class="small" id="rank">ECO ROOKIE</div><b id="level">Seviye 1</b></div></div><div class="card task" id="quest"></div><div class="card"><div class="small">KASABANIN NEŞESİ</div><b id="ecoLabel">%0 • Yeni başlangıç</b><div class="meter"><span id="ecoBar"></span></div></div></div><div id="mapnote" class="hidden"></div><div id="bottom" class="hidden"><div id="hint">WASD / Oklar: yürü · E: etkileşim · B: bisiklet · M: harita</div><button id="interact">E • Keşfet</button></div><div id="mobile" class="hidden"><span></span><button data-key="ArrowUp" aria-label="Yukarı">▲</button><span></span><button data-key="ArrowLeft" aria-label="Sol">◀</button><button data-key="ArrowDown" aria-label="Aşağı">▼</button><button data-key="ArrowRight" aria-label="Sağ">▶</button></div><div id="toast" role="status"></div><div id="modal"><div id="content" class="panel"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const W=2800,H=1900,ZONEW=700,ZONEH=900,types=['Plastik','Cam','Kağıt','Metal'],symbols=['🧴','🍾','📰','🥫'],colors=['#f2cf55','#76bf7a','#78b4de','#b6bdc4'];
const zones=[{name:'Şehir Merkezi',x:0,y:0,need:0,color:'#bad4a2',npc:'Ada',request:'Merkezdeki 12 çöpü topla; sonra geri dönüştür!',kind:'trash',goal:12},{name:'Park',x:700,y:0,need:0,color:'#b3d99c',npc:'Çınar',request:'Beş fidan dikelim. Park yeniden nefes alsın!',kind:'tree',goal:5},{name:'Okul',x:1400,y:0,need:100,color:'#d4dca9',npc:'Ece',request:'Boşuna açık kalan üç cihazı kapatabilir misin?',kind:'energy',goal:3},{name:'Fabrika Bölgesi',x:2100,y:0,need:500,color:'#b9bcb0',npc:'Usta Cem',request:'Güneş panellerini kurup beş cihazı kapatalım!',kind:'energy',goal:5},{name:'Mahalle',x:0,y:900,need:180,color:'#d1dca8',npc:'Mina',request:'Beş musluğu kapat. Boşa akan suyu kurtar!',kind:'water',goal:5},{name:'Sahil',x:700,y:900,need:280,color:'#e8d59b',npc:'Deniz',request:'Sahildeki 16 çöpü toplayalım!',kind:'trash',goal:16},{name:'Orman',x:1400,y:900,need:380,color:'#a9cc8f',npc:'Toprak',request:'On fidan dikerek hayvanlara ev hazırlayalım!',kind:'tree',goal:10}];
const fresh=()=>({version:1,ep:0,xp:0,done:{},growth:{},bag:[],quests:{},badges:[],counts:{trash:0,recycle:0,tree:0,energy:0,water:0,mini:0},owned:['coral'],outfit:'coral',hat:false,pack:false,bike:false,deco:false,muted:false,music:true,travel:0});
let state=fresh();try{const saved=JSON.parse(localStorage.getItem('ecohero-town-v1'));if(saved&&saved.version===1)state={...fresh(),...saved,counts:{...fresh().counts,...saved.counts}}}catch(e){}
let player={x:340,y:530},camera={x:0,y:0},keys={},view='menu',time=0,last=0,near=null,particles=[],biking=false,audio=null,musicTimer=null,toastTimer,mini=null;const objects=[],buildings=[];
let seed=3107;function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}function rect(x,y,w,h,color,r=10){ctx.fillStyle=color;ctx.strokeStyle='#20352b';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.stroke()}function ellipse(x,y,rx,ry,c,stroke=true){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(stroke){ctx.strokeStyle='#20352b';ctx.lineWidth=3;ctx.stroke()}}function text(t,x,y,size=15,c='#20352b'){ctx.fillStyle=c;ctx.font=`bold ${size}px Trebuchet MS`;ctx.textAlign='center';ctx.fillText(t,x,y)}
function add(z,kind,n){for(let i=0;i<n;i++){const x=z.x+65+rand()*560,y=z.y+410+rand()*340;objects.push({id:`${zones.indexOf(z)}-${kind}-${i}`,z:zones.indexOf(z),kind,x,y,type:i%4})}}
zones.forEach((z,i)=>{buildings.push({x:z.x+85,y:z.y+110,w:190,h:145,z:i,color:['#f3a67e','#ebcf76','#83bdc9','#adb0bd','#c4a1c3','#83bbcc','#dab788'][i],name:['ECO KAFE','PARK KULÜBÜ','ECO OKUL','GÜNEŞ ATÖLYESİ','MAHALLE EVİ','SAHİL KULÜBÜ','ORMAN EVİ'][i]});objects.push({id:`npc-${i}`,kind:'npc',z:i,x:z.x+345,y:z.y+340});objects.push({id:`bin-${i}`,kind:'bin',z:i,x:z.x+530,y:z.y+330});add(z,'trash',[12,10,8,14,10,16,8][i]);add(z,'tree',[4,12,5,6,5,5,15][i]);add(z,'energy',[3,1,3,5,3,1,1][i]);add(z,'water',[2,2,2,2,5,3,2][i]);objects.push({id:`mini-${i}`,z:i,kind:'mini',x:z.x+540,y:z.y+160,mode:['recycle','race','plant','solar','pipe','recycle','plant'][i]});objects.push({id:`bus-${i}`,z:i,kind:'bus',x:z.x+360,y:z.y+795})});
const total=objects.filter(o=>['trash','tree','energy','water'].includes(o.kind)).length;function unlocked(z){return state.xp>=zones[z].need}function eco(){return Math.round(Object.keys(state.done).filter(k=>!k.startsWith('mini')).length/total*100)}function level(){return Math.min(20,1+Math.floor(state.xp/100))}function save(){try{localStorage.setItem('ecohero-town-v1',JSON.stringify(state))}catch(e){toast('Bu tarayıcı kayda izin vermiyor; oyun bu oturumda devam eder.')}}function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,4200)}
function sound(success=false){if(state.muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();[success?523:390,success?659:520,success?784:650].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime+i*.08);g.gain.exponentialRampToValueAtTime(.06,audio.currentTime+i*.08+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+i*.08+.18);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+i*.08);o.stop(audio.currentTime+i*.08+.2)})}catch(e){}}
function startMusic(){clearInterval(musicTimer);if(state.muted||!state.music)return;let n=0;musicTimer=setInterval(()=>{if(view!=='play'||!audio)return;const notes=[262,330,392,330,294,349,440,349],o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=notes[n++%notes.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.018,audio.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.65);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.7)},750)}
function award(points,kind,x=player.x,y=player.y){const old=state.xp;state.ep+=points;state.xp+=points;if(kind)state.counts[kind]++;for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*140,vy:-50-Math.random()*90,life:1,color:['#ffd65e','#fff9e8','#7dc57a'][i%3]});sound(true);for(const z of zones)if(old<z.need&&state.xp>=z.need)toast(`Yeni bölge açıldı: ${z.name}! Haritada seni bekliyor.`);checkBadges();save();hud()}
const badgeDefs=[['first','🌱','İlk Fidan','İlk ağacını dik.',()=>state.counts.tree>=1],['recycle','♻️','Geri Dönüşüm Ustası','100 atığı geri dönüştür.',()=>state.counts.recycle>=100],['water','💧','Su Koruyucusu','25 musluğu kapat.',()=>state.counts.water>=25],['forest','🌳','Orman Kahramanı','50 ağaç dik.',()=>state.counts.tree>=50],['planet','🌍','Gezegen Koruyucusu','Kasabadaki tüm çevre görevlerini bitir.',()=>eco()===100]];
function checkBadges(){for(const [id,icon,name,,check]of badgeDefs)if(!state.badges.includes(id)&&check()){state.badges.push(id);toast(`${icon} Yeni rozet: ${name}`)}}function hud(){const e=eco();$('ep').textContent=state.ep+' EP';$('level').textContent='Seviye '+level();$('rank').textContent=level()>=20?'PLANET PROTECTOR':level()>=10?'GREEN HERO':level()>=5?'NATURE FRIEND':'ECO ROOKIE';$('ecoLabel').textContent=`%${e} • ${e>75?'Capcanlı!':e>35?'Yeşeriyor':'Yeni başlangıç'}`;$('ecoBar').style.width=e+'%';const active=Object.entries(state.quests).find(([z,v])=>v==='active');if(active){const z=zones[+active[0]],n=objects.filter(o=>o.z===+active[0]&&o.kind===z.kind&&state.done[o.id]).length;$('quest').innerHTML=`<div class="small">${z.npc.toUpperCase()} SENİ BEKLİYOR</div><b>${z.request}</b><br>${Math.min(n,z.goal)} / ${z.goal} · Tamamlayınca ${z.npc} ile konuş.`}else $('quest').innerHTML='<div class="small">BUGÜNÜN MACERASI</div><b>Bir komşuyla konuş, kasabayı keşfet!</b><br>Sarı işaretlere yaklaş ve E’ye bas.'}
function hideModal(){view='play';mini=null;$('modal').classList.add('hidden');['hud','bottom','mapnote','mobile'].forEach(id=>$(id).classList.remove('hidden'));keys={};hud()}
function panel(title,body){view='panel';keys={};$('modal').classList.remove('hidden');$('content').className='panel';$('content').innerHTML=`<header><h2>${title}</h2><button onclick="hideModal()" aria-label="Kapat">✕</button></header>${body}`}
function menu(){view='menu';keys={};['hud','bottom','mapnote','mobile'].forEach(id=>$(id).classList.add('hidden'));$('modal').classList.remove('hidden');$('content').className='panel menuPanel';$('content').innerHTML=`<div class="eyebrow">BÜYÜK DEĞİŞİMLERİN KÜÇÜK KAHRAMANI</div><h1 class="logo">EcoHero<br><span>Town</span></h1><p>Küçük hareketler bile<br>dünyayı değiştirebilir.</p><div class="buttons"><button class="primary" onclick="play()">${state.xp?'MACERAYA DEVAM ET':'OYNA'} →</button><button onclick="shop()">KARAKTER & ÖDÜLLER</button><button onclick="badges()">ROZETLER</button><button onclick="town()">KASABAM</button><button onclick="settings()">AYARLAR</button></div><p>Yürü. Keşfet. Birlikte yeşert. 🌱</p>`}
function play(){sound();startMusic();hideModal();if(!state.xp)toast('Hoş geldin kahraman! Ada’ya yaklaş, E’ye bas.');}
function badges(){panel('Küçük kahraman, büyük başarılar',`<p>Rozetler senin çevre maceranın hatıraları.</p><div class="grid">${badgeDefs.map(([id,icon,name,desc])=>`<div class="tile" style="opacity:${state.badges.includes(id)?1:.55}"><div style="font-size:35px">${icon}</div><strong>${name}</strong><div>${desc}</div><p class="tag">${state.badges.includes(id)?'KAZANILDI':'YOLCULUK DEVAM EDİYOR'}</p></div>`).join('')}</div>`)}
const rewards=[['mint','Nane kıyafet',60,'🧥'],['violet','Mor kahraman',90,'🦸'],['hat','Güneş şapkası',50,'👒'],['pack','Keşif çantası',70,'🎒'],['bike','Bisiklet',120,'🚲'],['deco','Evine çiçekler',100,'🌼']];
function shop(){panel('Kahramanına renk kat',`<p><b>${state.ep} EP</b> harcayabilirsin. Bölgeler ve seviyeler, kazandığın toplam puanla açılır.</p><div class="grid"><div class="tile">🧡<strong>Mercan kahraman</strong><button onclick="equip('coral')">${state.outfit==='coral'?'SEÇİLİ':'GİY'}</button></div>${rewards.map(([id,name,cost,icon])=>`<div class="tile"><div style="font-size:32px">${icon}</div><strong>${name}</strong><span>${state.owned.includes(id)?'Senin!':cost+' EP'}</span><button onclick="buy('${id}')" ${!state.owned.includes(id)&&state.ep<cost?'disabled':''}>${state.owned.includes(id)?(id===state.outfit||state[id]?'SEÇİLİ / DEĞİŞTİR':'KULLAN'):'AÇ'}</button></div>`).join('')}</div>`)}
function equip(id){state.outfit=id;save();shop()}function buy(id){const r=rewards.find(r=>r[0]===id);if(!state.owned.includes(id)){if(state.ep<r[2])return;state.ep-=r[2];state.owned.push(id)}if(['mint','violet'].includes(id))state.outfit=id;else state[id]=!state[id];save();shop();hud()}
function town(){panel('Kasabam • Keşif haritası',`<p>Çevre seviyesi <b>%${eco()}</b> · ${state.counts.trash} çöp toplandı · ${state.counts.tree} fidan dikildi.<br>Komşuların açılan bölgelere seni elektrikli otobüsle götürür.</p><div class="grid">${zones.map((z,i)=>`<div class="tile"><span class="tag">${unlocked(i)?'KEŞFE AÇIK':'🔒 '+z.need+' TOPLAM EP'}</span><strong>${z.name}</strong><div>${state.quests[i]==='complete'?'✓ Komşuna yardım ettin':z.npc+' ile tanış'}</div><button onclick="travel(${i})" ${unlocked(i)?'':'disabled'}>ELEKTRİKLİ OTOBÜS →</button></div>`).join('')}</div>`)}
function travel(i){if(!unlocked(i))return;player.x=zones[i].x+350;player.y=zones[i].y+520;state.travel++;save();hideModal();toast('Sessiz yolculuk! Elektrikli otobüs egzoz gazı çıkarmaz. Elektriğin kaynağı da önemlidir.');}
function settings(){panel('Ayarlar',`<label><input type="checkbox" ${!state.muted?'checked':''} onchange="state.muted=!this.checked;save();startMusic()"> Ses efektleri</label><label><input type="checkbox" ${state.music?'checked':''} onchange="state.music=this.checked;save();startMusic()"> Rahatlatıcı müzik</label><p><b>Kontroller:</b> WASD veya oklarla yürü; E / Boşluk ile etkileş; B ile bisikletini kullan; M ile haritayı aç. Dokunmatik ekranda yön tuşları bulunur.</p><p>İlerleme bu tarayıcıda otomatik kaydedilir. İnternet ve hesap gerekmez.</p><button onclick="resetAsk()">Yeni macera başlat</button>`)}function resetAsk(){panel('Yeni bir başlangıç?',`<p>Bu tarayıcıdaki puanlar, görevler ve ödüller sıfırlanacak.</p><button class="primary" onclick="state=fresh();player={x:340,y:530};biking=false;save();menu()">Evet, sıfırdan başla</button>`)}
function nearest(){let best=null,d=85;for(const o of objects){if(!unlocked(o.z)||state.done[o.id]&&o.kind!=='mini')continue;const dist=Math.hypot(player.x-o.x,player.y-o.y);if(dist<d){best=o;d=dist}}return best}
const actions={trash:'Çöpü topla',tree:'Fidan dik',energy:'Cihazı kapat',water:'Musluğu kapat',npc:'Konuş',bin:'Geri dönüştür',mini:'Mini oyun',bus:'Otobüse bin'};
function interact(){if(view!=='play')return;const o=nearest();if(!o){toast('İşaretli nesnelere veya komşularına yaklaş.');return}if(o.kind==='npc'){const z=zones[o.z],n=objects.filter(a=>a.z===o.z&&a.kind===z.kind&&state.done[a.id]).length;if(state.quests[o.z]==='complete'){panel(z.npc+' gülümsüyor',`<p>“Teşekkür ederim! Kasabamız seninle daha güzel. Her küçük hareketin bir etkisi var.”</p><button class="primary" onclick="hideModal()">Keşfe devam et →</button>`)}else if(state.quests[o.z]==='active'&&n>=z.goal){state.quests[o.z]='complete';award(40);panel('Harikasın, kahraman!',`<p>“${z.name} artık çok daha güzel. İyi ki yardım ettin!”</p><p class="tag">+40 EP • Komşuluk ödülü</p><button class="primary" onclick="hideModal()">Yeni maceralara →</button>`)}else{state.quests[o.z]='active';save();panel(z.npc+' senden yardım istiyor',`<p>“${z.request}”</p><p class="tag">${Math.min(n,z.goal)} / ${z.goal} tamamlandı • Ödül: 40 EP</p><button class="primary" onclick="hideModal()">Hadi yapalım! →</button>`)}}else if(o.kind==='trash'){if(state.bag.length>=24){toast('Çantan doldu! ♻ kutusuna götür.');return}state.done[o.id]=true;state.bag.push(o.type);award(5,'trash',o.x,o.y);toast(`+5 EP • ${types[o.type]} toplandı. Çantanda ${state.bag.length} atık var.`)}else if(o.kind==='tree')startMini('plant',o);else if(o.kind==='energy'||o.kind==='water'){state.done[o.id]=true;award(10,o.kind,o.x,o.y);toast(o.kind==='water'?'+10 EP • Damla damla büyük fark! Suyu boşuna akıtma.':'+10 EP • Kullanmadığın cihazı kapatmak enerji tasarrufu sağlar.')}else if(o.kind==='bin'){if(!state.bag.length){toast('Önce yerdeki çöpleri topla, sonra buraya getir.');return}startMini('bag',o)}else if(o.kind==='bus')town();else if(o.kind==='mini')startMini(o.mode,o)}
function startMini(mode,o){mini={mode,o,index:0,score:0,step:0,angles:[1,2,3,1,2,0,3,2,1,2,1,3,2,3,1,2],deadline:Date.now()+35000};if(mode==='bag')mini.items=state.bag.slice();if(mode==='recycle')mini.items=Array.from({length:10},(_,i)=>i%4);if(mode==='race'){mini.startCount=state.counts.trash;mini.deadline=Date.now()+45000;view='play';$('modal').classList.add('hidden');toast('45 saniye! Parkta 5 çöp topla. Süre görev kartında.');return}renderMini()}
function renderMini(){if(!mini)return;const m=mini;if(m.mode==='bag'||m.mode==='recycle'){panel('♻️ Doğru kutuyu bul',`<p>Atığı sürükle veya doğru kutuya dokun. ${m.index+1} / ${m.items.length}</p><div class="miniTarget" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','eco-waste')">${symbols[m.items[m.index]]}<div style="font-size:17px">${['Plastik şişe','Cam şişe','Gazete','Metal kutu'][m.items[m.index]]}</div></div><div class="bins">${types.map((t,i)=>`<button style="background:${colors[i]}" ondragover="event.preventDefault()" ondrop="event.preventDefault();sortWaste(${i})" onclick="sortWaste(${i})">${t}</button>`).join('')}</div><p id="miniStatus" role="status">Doğru kutu, yepyeni bir başlangıç!</p>`)}else if(m.mode==='plant'){panel('🌱 Bir fidana yuva aç',`<p>${['Önce toprağı hazırla.','Şimdi fidanı yerleştir.','Can suyunu ver!'][m.step]}</p><div class="miniTarget">${['🪏','🌱','💧'][m.step]}</div><div class="progress"><i style="width:${m.step/3*100}%"></i></div><p></p><button class="primary" onclick="plantStep()">${['TOPRAĞI KAZ','FİDANI DİK','SULA'][m.step]}</button>`)}else if(m.mode==='pipe'){panel('💧 Boru ustası',`<p>Suyun yolunu aç! Her dirseği tıklayarak bağlantılarını döndür. Hedef: bütün parçalar <b>└</b> yönünde.</p><div class="pipeGrid">${m.angles.map((a,i)=>`<button onclick="rotatePipe(${i})" style="background:${a===0?'#a7d594':'#b9dbf1'}">${['└','┌','┐','┘'][a]}</button>`).join('')}</div><p id="miniStatus">${m.angles.filter(a=>a===0).length} / 16 doğru bağlantı</p>`)}else if(m.mode==='solar'){panel('☀️ Güneşi yakala',`<p>Panelleri sırayla güneşe doğru çevir. <b>☀ yukarıda!</b> Bütün paneller ↑ yönüne bakmalı.</p><div class="pipeGrid">${m.angles.slice(0,8).map((a,i)=>`<button style="background:${a===0?'#ffd66c':'#87b8cf'}" onclick="rotateSolar(${i})">${['↑','→','↓','←'][a]}</button>`).join('')}</div><p>Güneşten elektrik üretmek fosil yakıt kullanımını azaltabilir.</p>`)}mini=m}
function sortWaste(i){if(!mini)return;const m=mini,correct=m.items[m.index];if(i!==correct){$('miniStatus').textContent=`${symbols[correct]} Bu atık ${types[correct].toLocaleLowerCase('tr')} kutusuna ait. Bir daha dene!`;sound();return}if(m.mode==='bag'){state.bag.shift();award(10,'recycle')}m.score++;m.index++;if(m.index>=m.items.length){if(m.mode==='recycle'){state.counts.recycle+=m.score;award(20,'mini');if(!state.done[m.o.id]){state.done[m.o.id]=true;save()}}hideModal();toast('♻️ Harika! Geri dönüşüm, yeni ürünler için kaynak kazandırır.')}else renderMini()}
function plantStep(){if(!mini)return;mini.step++;if(mini.step<3){renderMini();return}const o=mini.o;if(o.kind==='tree'){state.done[o.id]=true;state.growth[o.id]=Date.now();award(20,'tree',o.x,o.y)}else{state.counts.tree++;award(15,'mini');}hideModal();toast('🌱 Fidanın büyümeye başladı! Ağaçlar büyürken karbondioksit emer.');}
function rotatePipe(i){mini.angles[i]=(mini.angles[i]+1)%4;if(mini.angles.every(a=>a===0)){state.counts.water++;award(20,'mini');hideModal();toast('💧 Tamir tamam! Sızıntıları onarmak suyu korur.')}else renderMini()}
function rotateSolar(i){mini.angles[i]=(mini.angles[i]+1)%4;if(mini.angles.slice(0,8).every(a=>a===0)){award(25,'mini');hideModal();toast('☀️ Paneller hazır! Güneş enerjisi kasabana güç katıyor.')}else renderMini()}
function tree(x,y,s=1,young=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,8,29,10,'#20352b20',false);rect(-7,-48,14,55,'#a6774e',4);if(young){ellipse(-14,-37,18,10,'#8ac46e');ellipse(13,-52,18,10,'#9dd27b')}else{ellipse(0,-80,35,38,'#6ba86b');ellipse(-24,-63,26,26,'#78b974');ellipse(25,-60,28,29,'#87c17b');ellipse(-8,-95,27,25,'#8ac77c');ctx.strokeStyle='#bce19b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-9,-87,13,3.5,5);ctx.stroke()}ctx.restore()}
function character(x,y,color='#ef9274',npc=false,walk=0){ctx.save();ctx.translate(x,y);ellipse(0,7,19,7,'#20352b25',false);if(!npc&&biking){ellipse(-22,5,16,16,'#cee0d8');ellipse(22,5,16,16,'#cee0d8');ctx.strokeStyle='#20352b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-22,5);ctx.lineTo(0,-12);ctx.lineTo(22,5);ctx.lineTo(-22,5);ctx.stroke()}rect(-13,-26,11,30+Math.sin(walk)*3,'#375a63',5);rect(3,-26,11,30-Math.sin(walk)*3,'#375a63',5);if(!npc&&state.pack)rect(10,-50,15,25,'#f0ce61',6);rect(-20,-51,40,35,color,11);ellipse(-20,-35,6,10,'#f6c6a1');ellipse(20,-35,6,10,'#f6c6a1');ellipse(0,-67,22,24,'#ffd1a6');ctx.beginPath();ctx.moveTo(-22,-72);ctx.bezierCurveTo(-27,-103,20,-100,23,-72);ctx.lineTo(9,-84);ctx.lineTo(-7,-82);ctx.closePath();ctx.fillStyle='#55463b';ctx.fill();ctx.stroke();ellipse(-8,-65,2,3,'#20352b',false);ellipse(8,-65,2,3,'#20352b',false);ctx.beginPath();ctx.arc(0,-60,7,.2,Math.PI-.2);ctx.stroke();if(!npc&&state.hat){rect(-29,-88,58,9,'#f5cf65',5);rect(-18,-108,36,23,'#f5cf65',9)}ctx.restore()}
function building(b){const clean=eco()>45;ctx.save();ctx.translate(b.x,b.y);ellipse(b.w/2,b.h+4,b.w/2+12,15,'#20352b1c',false);rect(0,0,b.w,b.h,clean?b.color:'#c4bea2',8);ctx.beginPath();ctx.moveTo(-15,8);ctx.lineTo(b.w/2,-64);ctx.lineTo(b.w+15,8);ctx.closePath();ctx.fillStyle=clean?'#dd866b':'#a58e80';ctx.fill();ctx.stroke();rect(70,b.h-65,48,65,'#7c6254',5);ellipse(106,b.h-30,3,3,'#ffdd80');for(const x of [20,133]){rect(x,32,38,42,'#b1d9db',6);ctx.beginPath();ctx.moveTo(x+19,32);ctx.lineTo(x+19,74);ctx.moveTo(x,53);ctx.lineTo(x+38,53);ctx.stroke()}rect(17,-2,b.w-34,27,'#fff5d9',6);text(b.name,b.w/2,17,12);if(state.deco&&b.z===0||eco()>70){for(const x of [25,165]){rect(x-8,b.h-18,16,18,'#db966b',3);ellipse(x,b.h-26,12,12,'#8cc478');ellipse(x,b.h-35,6,6,'#ffd467')}}if(b.z===3){rect(146,-94,25,61,'#8c9996',3);if(eco()<70){for(let j=0;j<3;j++)ellipse(158+Math.sin(time+j)*13,-105-j*26,20+j*8,15+j*4,'#818c8650',false)}else{rect(20,-30,75,20,'#76b9d1',4)}}ctx.restore()}
function drawObject(o){const done=state.done[o.id],x=o.x,y=o.y;if(o.kind==='tree'){if(done){const age=(Date.now()-(state.growth[o.id]||0))/1000;tree(x,y,Math.min(1,.3+age/90),age<20)}else{ellipse(x,y,22,12,'#c4ad7b');text('+',x,y+5,20);text('🌱',x,y-21,23)}return}if(done&&['trash','water','energy'].includes(o.kind)){if(o.kind==='water'){rect(x-12,y-18,24,22,'#93bbaa',5);text('✓',x,y,15)}if(o.kind==='energy'){rect(x-17,y-30,34,32,'#8ca39b',5);rect(x-12,y-26,24,17,'#485c56',3)}return}if(o.kind==='trash'){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(x)*.3);rect(-11,-8,22,17,['#f1d777','#8cb7a7','#f1ead6','#a9b9c0'][o.type],4);text(['P','C','K','M'][o.type],0,5,12);ctx.restore()}else if(o.kind==='npc'){character(x,y,['#ecab65','#9ab378','#a591c0','#809eab','#d0929d','#7fb8c5','#c49c71'][o.z],true);rect(x-18,y-120,36,30,state.quests[o.z]==='complete'?'#a5d483':'#ffda63',9);text(state.quests[o.z]==='complete'?'♥':'!',x,y-98,23);text(zones[o.z].npc,x,y+28,14)}else if(o.kind==='bin'){for(let i=0;i<4;i++){rect(x-50+i*27,y-34,23,40,colors[i],4);rect(x-52+i*27,y-40,27,8,colors[i],3)}text('♻',x,y-57,24)}else if(o.kind==='energy'){rect(x-17,y-30,34,32,'#deaf70',5);rect(x-12,y-26,24,17,'#fff1a3',3);text('⚡',x,y-41,22)}else if(o.kind==='water'){rect(x-12,y-18,24,22,'#a4c6c5',5);rect(x-3,y-32,24,10,'#bcd6cf',4);for(let j=0;j<3;j++)ellipse(x+18,y-8+((time*25+j*10)%28),3,5,'#6db6d8',false);text('💧',x,y-46,20)}else if(o.kind==='mini'){rect(x-27,y-25,54,40,'#f1bda0',9);text({recycle:'♻',race:'⏱',plant:'🌱',solar:'☀',pipe:'💧'}[o.mode],x,y+3,24);text('DENE!',x,y-35,11)}else if(o.kind==='bus'){rect(x-34,y-28,68,45,'#a2cca1',10);rect(x-26,y-23,50,20,'#cee7e9',4);ellipse(x-20,y+17,8,8,'#536962');ellipse(x+20,y+17,8,8,'#536962');text('ECO',x,y+9,11)}if(near===o&&view==='play'){ctx.strokeStyle='#ffda63';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x,y+5,34,15,0,0,Math.PI*2);ctx.stroke()}}
function draw(dt){const width=canvas.width,height=canvas.height;ctx.clearRect(0,0,width,height);const scale=Math.min(1.25,Math.max(.65,width/1250));ctx.save();ctx.scale(scale,scale);const sw=width/scale,sh=height/scale;const target=view==='menu'?{x:760,y:360}:player;camera.x+=(target.x-sw/2-camera.x)*Math.min(1,dt*5);camera.y+=(target.y-sh/2-camera.y)*Math.min(1,dt*5);camera.x=Math.max(-100,Math.min(W-sw+100,camera.x));camera.y=Math.max(-80,Math.min(H-sh+80,camera.y));ctx.translate(-camera.x,-camera.y);ctx.fillStyle='#8dbeb1';ctx.fillRect(-1000,-1000,W+2000,H+2000);
for(const [i,z]of zones.entries()){ctx.fillStyle=z.color;ctx.fillRect(z.x,z.y,690,890);const e=eco();ctx.fillStyle=e>45?'#a5d28e':'#bdc79f';for(let j=0;j<35;j++){const x=z.x+25+(j*113)%650,y=z.y+30+(j*157)%820;ellipse(x,y,3,2,ctx.fillStyle,false)}ctx.fillStyle='#ecdbb9';ctx.fillRect(z.x+25,z.y+370,640,55);ctx.fillRect(z.x+300,z.y+280,55,550);ctx.fillRect(z.x+20,z.y+760,650,70);ctx.strokeStyle='#b9ab8b';ctx.lineWidth=2;ctx.setLineDash([12,18]);ctx.beginPath();ctx.moveTo(z.x+30,z.y+400);ctx.lineTo(z.x+650,z.y+400);ctx.stroke();ctx.setLineDash([]);rect(z.x+345,z.y+60,260,40,'#fff7df',9);text(z.name,z.x+475,z.y+86,17);for(let j=0;j<4;j++)tree(z.x+55+j*158,z.y+70,.65);if(i===5){ctx.fillStyle='#78c3d1';ctx.fillRect(z.x+20,z.y+850,650,40);for(let j=0;j<12;j++){ctx.strokeStyle='#cbe6df';ctx.beginPath();ctx.moveTo(z.x+35+j*52,z.y+870+Math.sin(time+j)*4);ctx.lineTo(z.x+55+j*52,z.y+870+Math.sin(time+j)*4);ctx.stroke()}}if(e>40){for(let j=0;j<12;j++){const x=z.x+45+(j*71)%600,y=z.y+490+(j*67)%210;text(['🌼','🌷'][j%2],x,y,16)}}if(e>65){for(let j=0;j<2;j++){const x=z.x+100+j*410+Math.sin(time*.7+j)*25,y=z.y+640;ellipse(x,y,12,8,'#fff3df');ellipse(x+10,y-9,8,8,'#fff3df');ellipse(x+8,y-20,3,10,'#fff3df');ellipse(x+15,y-20,3,10,'#fff3df');ellipse(x+14,y-10,2,2,'#20352b',false)}}}
// Sort the hero and scenery together so walking behind objects feels natural.
const drawables=[...buildings.map(b=>({y:b.y+b.h,draw:()=>building(b)})),...objects.map(o=>({y:o.y,draw:()=>drawObject(o)})),{y:player.y,draw:()=>character(player.x,player.y,{coral:'#ef9274',mint:'#85b69b',violet:'#ad95c8'}[state.outfit]||'#ef9274',false,(keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight||keys.w||keys.a||keys.s||keys.d)?time*13:0)}];drawables.sort((a,b)=>a.y-b.y).forEach(a=>a.draw());
for(const [i,z]of zones.entries())if(!unlocked(i)){ctx.fillStyle='#20352b88';ctx.fillRect(z.x,z.y,690,890);rect(z.x+160,z.y+430,380,80,'#fff6df',14);text('🔒 '+z.name,z.x+350,z.y+461,21);text(z.need+' toplam EP ile keşfe açılır',z.x+350,z.y+490,15)}
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;ctx.globalAlpha=Math.max(0,p.life);ellipse(p.x,p.y,4,4,p.color,false)}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;ctx.restore();const haze=Math.max(0,.12-eco()/700);ctx.fillStyle=`rgba(115,111,92,${haze})`;ctx.fillRect(0,0,width,height);ctx.fillStyle='#fff9e8';ctx.font='bold 12px Trebuchet MS';ctx.textAlign='right';if(view==='menu')ctx.fillText('EL ÇİZİMİ BİR ÇEVRE MACERASI',width-25,height-25)}
function allowed(x,y){if(x<30||x>W-30||y<40||y>1800)return false;const z=zones.findIndex(z=>x>=z.x&&x<z.x+700&&y>=z.y&&y<z.y+900);if(z<0||!unlocked(z))return false;return!buildings.some(b=>x>b.x-18&&x<b.x+b.w+18&&y>b.y-12&&y<b.y+b.h+12)}
function update(dt){if(view!=='play')return;let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if(dx||dy){const n=Math.hypot(dx,dy),speed=biking?290:170,nx=player.x+dx/n*speed*dt,ny=player.y+dy/n*speed*dt;if(allowed(nx,player.y))player.x=nx;if(allowed(player.x,ny))player.y=ny}near=nearest();$('interact').textContent=near?'E • '+actions[near.kind]:'E • Keşfet';const z=zones.find(z=>player.x>=z.x&&player.x<z.x+700&&player.y>=z.y&&player.y<z.y+900);$('mapnote').textContent=(z?.name||'Kasaba')+' · 🎒 '+state.bag.length+'/24'+(biking?' · 🚲':'');if(mini?.mode==='race'){const left=Math.max(0,Math.ceil((mini.deadline-Date.now())/1000)),n=state.counts.trash-mini.startCount;$('quest').innerHTML=`<div class="small">PARK TEMİZLEME YARIŞI</div><b>${left} saniye · ${Math.min(5,n)} / 5 çöp</b>`;if(n>=5){mini=null;award(30,'mini');toast('⏱ Süper hız! Park tertemiz: +30 EP')}else if(!left){mini=null;hud();toast('Süre bitti. Topladığın çöpler yine de kasabana yardım etti!')}}}
function frame(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;time+=dt;update(dt);draw(dt);requestAnimationFrame(frame)}function resize(){canvas.width=innerWidth;canvas.height=innerHeight}window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();if(view!=='play'){if(k==='Escape')hideModal();return}keys[k]=true;if(e.repeat)return;if(k==='e'||k===' ')interact();if(k==='Escape')menu();if(k==='m')town();if(k==='b'){if(state.owned.includes('bike')){biking=!biking;toast(biking?'🚲 Hadi pedalla!':'Yürüyüşe devam.')}else toast('Bisikletini Karakter & Ödüller menüsünden açabilirsin.')}});window.addEventListener('keyup',e=>keys[e.key.length===1?e.key.toLowerCase():e.key]=false);window.addEventListener('blur',()=>keys={});document.addEventListener('visibilitychange',()=>{keys={};if(document.hidden&&view==='play'){mini=null;menu()}});$('menuBtn').onclick=menu;$('interact').onclick=interact;document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys[b.dataset.key]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(evt=>b.addEventListener(evt,()=>keys[b.dataset.key]=false))});resize();menu();requestAnimationFrame(frame);
</script></body></html>
