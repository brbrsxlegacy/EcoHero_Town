:root{--ink:#20352b;--paper:#fff9e8;--green:#3f8255;--yellow:#ffd85f}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#bde7ad;color:var(--ink);font-family:Trebuchet MS,Arial,sans-serif}button{font:inherit;font-weight:800;color:var(--ink);cursor:pointer;border:3px solid var(--ink);border-radius:16px;background:var(--paper);padding:12px 20px;box-shadow:0 4px 0 var(--ink)}button:hover{background:#ffe899;transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:none}button:focus-visible{outline:4px solid #f28552;outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;inset:20px 22px auto;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 #20352b25;padding:13px 18px}.leftHud{display:flex;gap:10px;align-items:center}.leftHud button,#hud button{pointer-events:auto}.points{font-weight:900;font-size:23px}.small{font-size:12px;letter-spacing:1px;font-weight:bold;opacity:.7}.meter{width:170px;height:12px;border:2px solid var(--ink);border-radius:10px;background:#ddd9ba;margin-top:7px;overflow:hidden}.meter span{display:block;height:100%;background:#74bb63;transition:width .5s}.task{max-width:300px;font-size:14px;line-height:1.45}#bottom{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}#hint{background:var(--paper);border:2px solid var(--ink);border-radius:15px;padding:10px 16px;font-size:13px;white-space:nowrap}#interact{background:var(--yellow);min-width:140px}#toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);max-width:90vw;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px 22px;font-weight:800;box-shadow:0 5px 0 #20352b30;opacity:0;transition:opacity .2s;pointer-events:none;z-index:8}#modal{position:fixed;inset:0;background:#20352b66;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;backdrop-filter:blur(2px)}#modal.hidden,.hidden{display:none!important}.panel{width:min(850px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:28px;padding:30px;box-shadow:0 10px 0 #20352b55}.panel h2{font-size:30px;margin:0 0 8px}.panel p{line-height:1.55}.panel header{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-top:22px}.tile{border:2px solid var(--ink);border-radius:18px;padding:18px;background:#e8eedb}.tile strong{display:block;margin:8px 0}.tile button{width:100%;padding:8px;margin-top:10px}.tag{display:inline-block;padding:5px 10px;background:#ffda73;border-radius:10px;font-size:12px;font-weight:bold}.menuPanel{width:420px;text-align:center;background:#fff9e8f2;margin-left:-42vw}.logo{font-size:57px;line-height:.9;letter-spacing:-3px;text-shadow:3px 3px #20352b;color:#ffd65d;-webkit-text-stroke:2px var(--ink);margin:14px 0}.logo span{color:#85c57c;font-size:48px}.menuPanel .buttons{display:grid;gap:12px;margin-top:25px}.primary{background:var(--yellow)}.menuPanel p{font-size:14px}.eyebrow{font-weight:900;letter-spacing:2px;font-size:11px}#mobile{position:fixed;bottom:24px;left:18px;display:none;grid-template-columns:repeat(3,45px);gap:5px;touch-action:none}#mobile button{padding:9px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}.miniTarget{font-size:55px;text-align:center;margin:20px;padding:20px;background:#d9eecf;border:3px dashed var(--ink);border-radius:20px;cursor:grab}.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bins button{padding:18px 6px}#miniStatus{min-height:26px;font-weight:800}.pipeGrid{display:grid;grid-template-columns:repeat(4,55px);gap:7px;justify-content:center;margin:20px}.pipeGrid button{height:55px;padding:0;font-size:29px}.progress{height:14px;background:#dadcc5;border:2px solid var(--ink);border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#7fb865}label{display:flex;gap:15px;align-items:center;padding:18px 0;font-weight:bold}input{accent-color:#438259}#mapnote{position:fixed;left:23px;bottom:85px;font-size:13px;font-weight:900;padding:8px 13px;background:#fff9e8dd;border:2px solid var(--ink);border-radius:10px;pointer-events:none}@media(max-width:700px){#hud{inset:10px;gap:6px}.card{padding:8px 10px;border-radius:14px}.points{font-size:17px}.small{font-size:10px}.meter{width:100px}.task{display:none}.leftHud{gap:5px}#hud button{padding:10px}.menuPanel{margin:0;width:350px}.logo{font-size:49px}.panel{padding:20px}#mobile{display:grid}#hint{display:none}#bottom{left:auto;right:14px;transform:none;bottom:35px}#interact{min-width:115px;padding:15px 10px}#mapnote{bottom:165px;left:12px}.bins{grid-template-columns:repeat(2,1fr)}}
</style></head><body><canvas id="game" aria-label="EcoHero Town oyun alanı"></canvas><div id="hud" class="hidden"><div class="leftHud"><button id="menuBtn" aria-label="Menü">☰</button><button onclick="cameraAngle+=Math.PI/4" aria-label="Kamerayı döndür">↻</button><div class="card"><div class="small">ECO POINTS</div><div class="points" id="ep">0 EP</div></div><div class="card"><div class="small" id="rank">ECO ROOKIE</div><b id="level">Seviye 1</b></div></div><div class="card task" id="quest"></div><div class="card"><div class="small">KASABANIN NEŞESİ</div><b id="ecoLabel">%0 • Yeni başlangıç</b><div class="meter"><span id="ecoBar"></span></div></div></div><div id="mapnote" class="hidden"></div><div id="bottom" class="hidden"><div id="hint">WASD / Oklar: yürü · E: etkileşim · B: bisiklet · M: harita · Q/R: kamera</div><button id="interact">E • Keşfet</button></div><div id="mobile" class="hidden"><span></span><button data-key="ArrowUp" aria-label="Yukarı">▲</button><span></span><button data-key="ArrowLeft" aria-label="Sol">◀</button><button data-key="ArrowDown" aria-label="Aşağı">▼</button><button data-key="ArrowRight" aria-label="Sağ">▶</button></div><div id="toast" role="status"></div><div id="modal"><div id="content" class="panel"></div></div>
<script src="vendor/three.min.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game');
const W=2800,H=1900,ZONEW=700,ZONEH=900,types=['Plastik','Cam','Kağıt','Metal'],symbols=['🧴','🍾','📰','🥫'],colors=['#f2cf55','#76bf7a','#78b4de','#b6bdc4'];
const zones=[{name:'Şehir Merkezi',x:0,y:0,need:0,color:'#bad4a2',npc:'Ada',request:'Merkezdeki 12 çöpü topla; sonra geri dönüştür!',kind:'trash',goal:12},{name:'Park',x:700,y:0,need:0,color:'#b3d99c',npc:'Çınar',request:'Beş fidan dikelim. Park yeniden nefes alsın!',kind:'tree',goal:5},{name:'Okul',x:1400,y:0,need:100,color:'#d4dca9',npc:'Ece',request:'Boşuna açık kalan üç cihazı kapatabilir misin?',kind:'energy',goal:3},{name:'Fabrika Bölgesi',x:2100,y:0,need:500,color:'#b9bcb0',npc:'Usta Cem',request:'Güneş panellerini kurup beş cihazı kapatalım!',kind:'energy',goal:5},{name:'Mahalle',x:0,y:900,need:180,color:'#d1dca8',npc:'Mina',request:'Beş musluğu kapat. Boşa akan suyu kurtar!',kind:'water',goal:5},{name:'Sahil',x:700,y:900,need:280,color:'#e8d59b',npc:'Deniz',request:'Sahildeki 16 çöpü toplayalım!',kind:'trash',goal:16},{name:'Orman',x:1400,y:900,need:380,color:'#a9cc8f',npc:'Toprak',request:'On fidan dikerek hayvanlara ev hazırlayalım!',kind:'tree',goal:10}];
const fresh=()=>({version:1,ep:0,xp:0,done:{},growth:{},bag:[],quests:{},badges:[],counts:{trash:0,recycle:0,tree:0,energy:0,water:0,mini:0},owned:['coral'],outfit:'coral',hat:false,pack:false,bike:false,deco:false,muted:false,music:true,travel:0});
let state=fresh();try{const saved=JSON.parse(localStorage.getItem('ecohero-town-v1'));if(saved&&saved.version===1)state={...fresh(),...saved,counts:{...fresh().counts,...saved.counts}}}catch(e){}
let player={x:340,y:530},camera={x:0,y:0},keys={},view='menu',time=0,last=0,near=null,particles=[],biking=false,audio=null,musicTimer=null,toastTimer,mini=null;const objects=[],buildings=[];
let seed=3107;function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}function add(z,kind,n){for(let i=0;i<n;i++){const x=z.x+65+rand()*560,y=z.y+410+rand()*340;objects.push({id:`${zones.indexOf(z)}-${kind}-${i}`,z:zones.indexOf(z),kind,x,y,type:i%4})}}
zones.forEach((z,i)=>{buildings.push({x:z.x+85,y:z.y+110,w:190,h:145,z:i,color:['#f3a67e','#ebcf76','#83bdc9','#adb0bd','#c4a1c3','#83bbcc','#dab788'][i],name:['ECO KAFE','PARK KULÜBÜ','ECO OKUL','GÜNEŞ ATÖLYESİ','MAHALLE EVİ','SAHİL KULÜBÜ','ORMAN EVİ'][i]});objects.push({id:`npc-${i}`,kind:'npc',z:i,x:z.x+345,y:z.y+340});objects.push({id:`bin-${i}`,kind:'bin',z:i,x:z.x+530,y:z.y+330});add(z,'trash',[12,10,8,14,10,16,8][i]);add(z,'tree',[4,12,5,6,5,5,15][i]);add(z,'energy',[3,1,3,5,3,1,1][i]);add(z,'water',[2,2,2,2,5,3,2][i]);objects.push({id:`mini-${i}`,z:i,kind:'mini',x:z.x+540,y:z.y+160,mode:['recycle','race','plant','solar','pipe','recycle','plant'][i]});objects.push({id:`bus-${i}`,z:i,kind:'bus',x:z.x+360,y:z.y+795})});
const total=objects.filter(o=>['trash','tree','energy','water'].includes(o.kind)).length;function unlocked(z){return state.xp>=zones[z].need}function eco(){return Math.round(Object.keys(state.done).filter(k=>!k.startsWith('mini')).length/total*100)}function level(){return Math.min(20,1+Math.floor(state.xp/100))}function save(){try{localStorage.setItem('ecohero-town-v1',JSON.stringify(state))}catch(e){toast('Bu tarayıcı kayda izin vermiyor; oyun bu oturumda devam eder.')}}function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,4200)}
function sound(success=false){if(state.muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();[success?523:390,success?659:520,success?784:650].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime+i*.08);g.gain.exponentialRampToValueAtTime(.06,audio.currentTime+i*.08+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+i*.08+.18);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+i*.08);o.stop(audio.currentTime+i*.08+.2)})}catch(e){}}
function startMusic(){clearInterval(musicTimer);if(state.muted||!state.music)return;let n=0;musicTimer=setInterval(()=>{if(view!=='play'||!audio)return;const notes=[262,330,392,330,294,349,440,349],o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=notes[n++%notes.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.018,audio.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.65);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.7)},750)}
function award(points,kind,x=player.x,y=player.y){actionUntil=time+.65;const old=state.xp;state.ep+=points;state.xp+=points;if(kind)state.counts[kind]++;for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*140,vy:-50-Math.random()*90,life:1,color:['#ffd65e','#fff9e8','#7dc57a'][i%3]});sound(true);for(const z of zones)if(old<z.need&&state.xp>=z.need)toast(`Yeni bölge açıldı: ${z.name}! Haritada seni bekliyor.`);checkBadges();save();hud()}
const badgeDefs=[['first','🌱','İlk Fidan','İlk ağacını dik.',()=>state.counts.tree>=1],['recycle','♻️','Geri Dönüşüm Ustası','100 atığı geri dönüştür.',()=>state.counts.recycle>=100],['water','💧','Su Koruyucusu','25 musluğu kapat.',()=>state.counts.water>=25],['forest','🌳','Orman Kahramanı','50 ağaç dik.',()=>state.counts.tree>=50],['planet','🌍','Gezegen Koruyucusu','Kasabadaki tüm çevre görevlerini bitir.',()=>eco()===100]];
function checkBadges(){for(const [id,icon,name,,check]of badgeDefs)if(!state.badges.includes(id)&&check()){state.badges.push(id);toast(`${icon} Yeni rozet: ${name}`)}}function hud(){const e=eco();$('ep').textContent=state.ep+' EP';$('level').textContent='Seviye '+level();$('rank').textContent=level()>=20?'PLANET PROTECTOR':level()>=10?'GREEN HERO':level()>=5?'NATURE FRIEND':'ECO ROOKIE';$('ecoLabel').textContent=`%${e} • ${e>75?'Capcanlı!':e>35?'Yeşeriyor':'Yeni başlangıç'}`;$('ecoBar').style.width=e+'%';const active=Object.entries(state.quests).find(([z,v])=>v==='active');if(active){const z=zones[+active[0]],n=objects.filter(o=>o.z===+active[0]&&o.kind===z.kind&&state.done[o.id]).length;$('quest').innerHTML=`<div class="small">${z.npc.toUpperCase()} SENİ BEKLİYOR</div><b>${z.request}</b><br>${Math.min(n,z.goal)} / ${z.goal} · Tamamlayınca ${z.npc} ile konuş.`}else $('quest').innerHTML='<div class="small">BUGÜNÜN MACERASI</div><b>Bir komşuyla konuş, kasabayı keşfet!</b><br>Sarı işaretlere yaklaş ve E’ye bas.'}
function hideModal(){view='play';mini=null;$('modal').classList.add('hidden');['hud','bottom','mapnote','mobile'].forEach(id=>$(id).classList.remove('hidden'));keys={};hud()}
function panel(title,body){view='panel';keys={};$('modal').classList.remove('hidden');$('content').className='panel';$('content').innerHTML=`<header><h2>${title}</h2><button onclick="hideModal()" aria-label="Kapat">✕</button></header>${body}`}
function menu(){view='menu';keys={};['hud','bottom','mapnote','mobile'].forEach(id=>$(id).classList.add('hidden'));$('modal').classList.remove('hidden');$('content').className='panel menuPanel';$('content').innerHTML=`<div class="eyebrow">BÜYÜK DEĞİŞİMLERİN KÜÇÜK KAHRAMANI</div><h1 class="logo">EcoHero<br><span>Town</span></h1><p>Küçük hareketler bile<br>dünyayı değiştirebilir.</p><div class="buttons"><button class="primary" onclick="play()">${state.xp?'MACERAYA DEVAM ET':'OYNA'} →</button><button onclick="shop()">KARAKTER & ÖDÜLLER</button><button onclick="badges()">ROZETLER</button><button onclick="town()">KASABAM</button><button onclick="settings()">AYARLAR</button></div><p>3D dünyayı keşfet. Birlikte yeşert. 🌱</p>`}
function play(){sound();startMusic();hideModal();if(!state.xp)toast('Hoş geldin kahraman! Ada’ya yaklaş, E’ye bas.');}
function badges(){panel('Küçük kahraman, büyük başarılar',`<p>Rozetler senin çevre maceranın hatıraları.</p><div class="grid">${badgeDefs.map(([id,icon,name,desc])=>`<div class="tile" style="opacity:${state.badges.includes(id)?1:.55}"><div style="font-size:35px">${icon}</div><strong>${name}</strong><div>${desc}</div><p class="tag">${state.badges.includes(id)?'KAZANILDI':'YOLCULUK DEVAM EDİYOR'}</p></div>`).join('')}</div>`)}
const rewards=[['mint','Nane kıyafet',60,'🧥'],['violet','Mor kahraman',90,'🦸'],['hat','Güneş şapkası',50,'👒'],['pack','Keşif çantası',70,'🎒'],['bike','Bisiklet',120,'🚲'],['deco','Evine çiçekler',100,'🌼']];
function shop(){panel('Kahramanına renk kat',`<p><b>${state.ep} EP</b> harcayabilirsin. Bölgeler ve seviyeler, kazandığın toplam puanla açılır.</p><div class="grid"><div class="tile">🧡<strong>Mercan kahraman</strong><button onclick="equip('coral')">${state.outfit==='coral'?'SEÇİLİ':'GİY'}</button></div>${rewards.map(([id,name,cost,icon])=>`<div class="tile"><div style="font-size:32px">${icon}</div><strong>${name}</strong><span>${state.owned.includes(id)?'Senin!':cost+' EP'}</span><button onclick="buy('${id}')" ${!state.owned.includes(id)&&state.ep<cost?'disabled':''}>${state.owned.includes(id)?(id===state.outfit||state[id]?'SEÇİLİ / DEĞİŞTİR':'KULLAN'):'AÇ'}</button></div>`).join('')}</div>`)}
function equip(id){state.outfit=id;save();shop()}function buy(id){const r=rewards.find(r=>r[0]===id);if(!state.owned.includes(id)){if(state.ep<r[2])return;state.ep-=r[2];state.owned.push(id)}if(['mint','violet'].includes(id))state.outfit=id;else state[id]=!state[id];save();shop();hud()}
function town(){panel('Kasabam • Keşif haritası',`<p>Çevre seviyesi <b>%${eco()}</b> · ${state.counts.trash} çöp toplandı · ${state.counts.tree} fidan dikildi.<br>Komşuların açılan bölgelere seni elektrikli otobüsle götürür.</p><div class="grid">${zones.map((z,i)=>`<div class="tile"><span class="tag">${unlocked(i)?'KEŞFE AÇIK':'🔒 '+z.need+' TOPLAM EP'}</span><strong>${z.name}</strong><div>${state.quests[i]==='complete'?'✓ Komşuna yardım ettin':z.npc+' ile tanış'}</div><button onclick="travel(${i})" ${unlocked(i)?'':'disabled'}>ELEKTRİKLİ OTOBÜS →</button></div>`).join('')}</div>`)}
function travel(i){if(!unlocked(i))return;player.x=zones[i].x+350;player.y=zones[i].y+520;state.travel++;save();hideModal();toast('Sessiz yolculuk! Elektrikli otobüs egzoz gazı çıkarmaz. Elektriğin kaynağı da önemlidir.');}
function settings(){panel('Ayarlar',`<label><input type="checkbox" ${!state.muted?'checked':''} onchange="state.muted=!this.checked;save();startMusic()"> Ses efektleri</label><label><input type="checkbox" ${state.music?'checked':''} onchange="state.music=this.checked;save();startMusic()"> Rahatlatıcı müzik</label><p><b>Kontroller:</b> WASD veya oklarla yürü; Q / R ile kamerayı döndür; E / Boşluk ile etkileş; B ile bisikletini kullan; M ile haritayı aç. Dokunmatik ekranda yön tuşları bulunur.</p><p>İlerleme bu tarayıcıda otomatik kaydedilir. İnternet ve hesap gerekmez.</p><button onclick="resetAsk()">Yeni macera başlat</button>`)}function resetAsk(){panel('Yeni bir başlangıç?',`<p>Bu tarayıcıdaki puanlar, görevler ve ödüller sıfırlanacak.</p><button class="primary" onclick="state=fresh();player={x:340,y:530};biking=false;save();menu()">Evet, sıfırdan başla</button>`)}
function nearest(){let best=null,d=85;for(const o of objects){if(!unlocked(o.z)||state.done[o.id]&&o.kind!=='mini')continue;const dist=Math.hypot(player.x-o.x,player.y-o.y);if(dist<d){best=o;d=dist}}return best}
